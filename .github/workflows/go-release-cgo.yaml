name: Go Release (CGO)

on:
    workflow_call:
        inputs:
            go-version:
                description: "Go version to use"
                required: false
                type: string
                default: ">=1.24"
            semver-config:
                description: "Path to semver config file"
                required: false
                type: string
                default: "semver.yaml"
            rolling-release-tag:
                description: "Create a rolling release tag (e.g., 'v1')"
                required: false
                type: string
                default: ""
            # Node.js support (optional)
            node-enabled:
                description: "Enable Node.js for frontend builds"
                required: false
                type: boolean
                default: false
            node-version:
                description: "Node.js version to use"
                required: false
                type: string
                default: "20"
            node-build-script:
                description: "Shell script to build frontend (runs in repo root)"
                required: false
                type: string
                default: ""
            node-cache-dependency-path:
                description: "Path to package-lock.json for npm caching"
                required: false
                type: string
                default: "package-lock.json"
            node-output-path:
                description: "Path to frontend build output (for artifact upload)"
                required: false
                type: string
                default: ""
            node-embed-path:
                description: "Path where frontend should be copied for Go embedding"
                required: false
                type: string
                default: ""
            # Platform configuration
            platforms:
                description: "JSON array of platforms"
                required: false
                type: string
                default: '[{"os":"macos-latest","goos":"darwin","goarch":"arm64","platform":"darwin_arm64"},{"os":"ubuntu-latest","goos":"linux","goarch":"amd64","platform":"linux_amd64"},{"os":"windows-latest","goos":"windows","goarch":"amd64","platform":"windows_amd64"}]'
            lfs:
                description: "Enable Git LFS checkout (for repos with large files)"
                required: false
                type: boolean
                default: false
            runner:
                description: "Runner label, or JSON object such as {\"group\":\"ci\",\"labels\":[\"linux\"]} to select a runner group. Falls back to vars.SHARED_ACTIONS_RUNNER, then ubuntu-latest."
                required: false
                type: string
                default: ""
            preflight:
                description: "Fail early when a required secret, env var or GoReleaser .Env reference is missing"
                required: false
                type: boolean
                default: true
            preflight-repos:
                description: "Comma-separated owner/repo list the token must have push access to (e.g. a Homebrew tap or helm-charts repo)"
                required: false
                type: string
                default: ""
            release-timeout:
                description: "GoReleaser timeout for the release step (Go duration)"
                required: false
                type: string
                default: "60m"
        outputs:
            version:
                description: "The calculated version (without v prefix)"
                value: ${{ jobs.version.outputs.version }}
            version_tag:
                description: "The version tag (with v prefix)"
                value: ${{ jobs.version.outputs.version_tag }}

concurrency:
    group: release-cgo-${{ github.repository }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    preflight:
        name: Preflight
        permissions:
            contents: write
            packages: write
        runs-on: ${{ fromJSON(startsWith(inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest', '{') && (inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest') || format('"{0}"', inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest')) }}
        timeout-minutes: 5
        steps:
            - name: Checkout
              if: inputs.preflight
              uses: actions/checkout@v7
              with:
                  lfs: false

            - name: Check secrets and access
              if: inputs.preflight
              uses: lukaszraczylo/shared-actions/.github/actions/preflight@main
              with:
                  require: GITHUB_TOKEN,GORELEASER_KEY
                  release-write: "true"
                  ghcr-push: auto
                  repo-access: ${{ inputs.preflight-repos }}
                  repo-token-env: GITHUB_TOKEN
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GORELEASER_KEY: ${{ secrets.GORELEASER_PRO }}

    test:
        name: Test
        needs: preflight
        runs-on: ${{ fromJSON(startsWith(inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest', '{') && (inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest') || format('"{0}"', inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest')) }}
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: ${{ inputs.lfs }}

            - name: Run workflow prepare script
              shell: bash
              run: |
                  if [ -f "./workflow-prepare.sh" ]; then
                    chmod +x ./workflow-prepare.sh
                    ./workflow-prepare.sh
                  fi

            - name: Run tests
              uses: lukaszraczylo/shared-actions/.github/actions/go-test@main
              with:
                  go-version: ${{ inputs.go-version }}
                  build-tags: "fts5"

    frontend:
        name: Build Frontend
        needs: preflight
        if: inputs.node-enabled && inputs.node-build-script != ''
        runs-on: ${{ fromJSON(startsWith(inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest', '{') && (inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest') || format('"{0}"', inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest')) }}
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  lfs: ${{ inputs.lfs }}

            - name: Run workflow prepare script
              shell: bash
              run: |
                  if [ -f "./workflow-prepare.sh" ]; then
                    chmod +x ./workflow-prepare.sh
                    ./workflow-prepare.sh
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: "npm"
                  cache-dependency-path: ${{ inputs.node-cache-dependency-path }}

            - name: Build frontend
              shell: bash
              run: ${{ inputs.node-build-script }}

            - name: Upload frontend artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist
                  path: ${{ inputs.node-output-path }}
                  retention-days: 1

    version:
        name: Calculate Version
        needs: test
        runs-on: ${{ fromJSON(startsWith(inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest', '{') && (inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest') || format('"{0}"', inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest')) }}
        outputs:
            version: ${{ steps.semver.outputs.version }}
            version_tag: ${{ steps.semver.outputs.version_tag }}
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: ${{ inputs.lfs }}

            - name: Run workflow prepare script
              shell: bash
              run: |
                  if [ -f "./workflow-prepare.sh" ]; then
                    chmod +x ./workflow-prepare.sh
                    ./workflow-prepare.sh
                  fi

            - name: Calculate version
              id: semver
              uses: lukaszraczylo/shared-actions/.github/actions/semver@main
              with:
                  config-file: ${{ inputs.semver-config }}

    build:
        name: Build (${{ matrix.platform }})
        needs: [version, frontend]
        if: |
            always() &&
            needs.version.result == 'success' &&
            needs.version.outputs.version_tag != '' &&
            (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(inputs.platforms) }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: ${{ inputs.lfs }}

            - name: Run workflow prepare script
              shell: bash
              env:
                  TARGET_GOOS: ${{ matrix.goos }}
                  TARGET_GOARCH: ${{ matrix.goarch }}
              run: |
                  if [ -f "./workflow-prepare.sh" ]; then
                    chmod +x ./workflow-prepare.sh
                    ./workflow-prepare.sh
                  fi

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ inputs.go-version }}
                  cache: true

            - name: Download frontend artifact
              if: inputs.node-enabled && inputs.node-embed-path != ''
              uses: actions/download-artifact@v8
              with:
                  name: frontend-dist
                  path: ${{ inputs.node-embed-path }}

            # goreleaser Pro --split pushes Docker images during the
            # per-target build job (not just the merge job), so we need
            # ghcr auth here too. Only on Linux runners — Docker builds
            # are Linux-only in the projects that consume this workflow.
            - name: Login to GitHub Container Registry
              if: matrix.goos == 'linux'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              if: matrix.goos == 'linux'
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: image=moby/buildkit:latest

            - name: Run GoReleaser (split)
              uses: lukaszraczylo/shared-actions/.github/actions/goreleaser@main
              with:
                  version-tag: ${{ needs.version.outputs.version_tag }}
                  timeout: ${{ inputs.release-timeout }}
                  mode: split
                  cgo-enabled: "1"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  goreleaser-key: ${{ secrets.GORELEASER_PRO }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-${{ matrix.platform }}
                  path: dist/
                  retention-days: 1

    release:
        name: Release
        needs: [version, build]
        if: |
            always() &&
            needs.version.result == 'success' &&
            needs.build.result == 'success'
        runs-on: ${{ fromJSON(startsWith(inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest', '{') && (inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest') || format('"{0}"', inputs.runner || vars.SHARED_ACTIONS_RUNNER || 'ubuntu-latest')) }}
        permissions:
            contents: write
            packages: write
            id-token: write
        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: ${{ inputs.lfs }}

            - name: Run workflow prepare script
              shell: bash
              run: |
                  if [ -f "./workflow-prepare.sh" ]; then
                    chmod +x ./workflow-prepare.sh
                    ./workflow-prepare.sh
                  fi

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ inputs.go-version }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: image=moby/buildkit:latest

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  pattern: release-*
                  merge-multiple: true

            - name: Download frontend artifact
              if: inputs.node-enabled && inputs.node-output-path != ''
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: frontend-dist
                  path: ${{ inputs.node-output-path }}

            - name: List artifacts
              run: ls -la dist/

            - name: Run GoReleaser (merge)
              uses: lukaszraczylo/shared-actions/.github/actions/goreleaser@main
              with:
                  version-tag: ${{ needs.version.outputs.version_tag }}
                  timeout: ${{ inputs.release-timeout }}
                  mode: merge
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  goreleaser-key: ${{ secrets.GORELEASER_PRO }}

            - name: Rolling release
              if: inputs.rolling-release-tag != ''
              uses: lukaszraczylo/shared-actions/.github/actions/rolling-release@main
              with:
                  tag: ${{ inputs.rolling-release-tag }}
                  version-tag: ${{ needs.version.outputs.version_tag }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
